<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>THE CAVE</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="description" content="A private training facility for observation, memory, deduction and composure.">
<meta name="theme-color" content="#05070a">
<meta name="color-scheme" content="dark">

<!-- iOS home-screen app -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Cave">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-32.png" sizes="32x32">
<link rel="manifest" href="manifest.webmanifest">

<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="vignette" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<header class="topbar" id="topbar">
  <button class="topbar__back" id="backBtn" aria-label="Back" hidden>
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div class="topbar__id">
    <span class="topbar__mark" aria-hidden="true"></span>
    <span class="topbar__title" id="topTitle">THE CAVE</span>
  </div>
  <div class="topbar__streak" id="topStreak" title="Consecutive days trained">
    <span class="flame" aria-hidden="true"></span><span id="streakNum">0</span>
  </div>
</header>

<main id="view" class="view" tabindex="-1"></main>

<nav class="tabbar" id="tabbar">
  <button class="tab" data-route="#/home">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
    <span>Cave</span>
  </button>
  <button class="tab" data-route="#/train">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="2.6" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    <span>Train</span>
  </button>
  <button class="tab" data-route="#/codex">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h9a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M17 7h2v13H8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
    <span>Codex</span>
  </button>
  <button class="tab" data-route="#/log">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M9 12h7M9 16h5M9 8h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    <span>Log</span>
  </button>
  <button class="tab" data-route="#/profile">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.6" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M4.8 20a7.4 7.4 0 0 1 14.4 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    <span>You</span>
  </button>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
